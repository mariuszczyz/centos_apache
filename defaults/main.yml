---
# defaults file for centos_apache

# Initial number of server processes to spawn on service start
apache_start_servers: 4

# Minimum number of idle worker processes
apache_min_spare_servers: 20

# Maximum number of idle worker processes to retain after a traffic spike
apache_max_spare_servers: 40

# Maximum number of simultaneous connections
apache_max_request_workers: 200

# Maximum number of requests a worker process handles before it is recycled
apache_max_connections_per_child: 4500
